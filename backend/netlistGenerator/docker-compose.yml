services:
  netlist-generator:
    build: .
    container_name: netlist-generator
    ports:
      - "8000:8000"
    environment:
      OPENCODE_API_KEY: ${OPENCODE_API_KEY}
      OPENCODE_API_BASE: ${OPENCODE_API_BASE:-https://opencode.ai/zen/v1}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-minimax-m2.5-free}
    restart: unless-stopped
